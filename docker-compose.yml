services:
  postgres:
    image: postgres:17
    container_name: mariokartcommunity-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: mariokart
      POSTGRES_PASSWORD: mariokart_dev
      POSTGRES_DB: mariokartcommunity

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: